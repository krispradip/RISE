<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Customer Solutions</title>
<style>
  :root { color-scheme:light; --ink:#1f2937; --muted:#64748b; --line:#e2e8f0; --bg:#ffffff; --blue:#2563eb; }
  *,*::before,*::after { box-sizing:border-box; }
  html,body { margin:0; width:100%; height:100%; overflow:hidden; overscroll-behavior:none; }
  body { font-family:Arial,"Helvetica Neue",Helvetica,sans-serif; background:var(--bg); color:var(--ink); }
  button,a { font:inherit; -webkit-tap-highlight-color:transparent; }
  button { cursor:pointer; }
  button:focus-visible,a:focus-visible { outline:3px solid #2563eb;outline-offset:4px; }
  main { width:100%; height:100vh;height:100dvh;overflow:hidden;position:relative; }
  .screen { display:none; width:100%; height:100%; overflow:hidden; }
  .screen.active { display:flex;flex-direction:column; }
  [hidden] { display:none!important; }

  /* Homepage: exactly two choices and nothing else. */
  .home { align-items:center;justify-content:center;padding:clamp(22px,4vw,64px); }
  .choices { display:grid;grid-template-columns:repeat(2,minmax(0,1fr)); gap:clamp(16px,2.2vw,28px);width:100%;max-width:1100px; }
  .choice { appearance:none;background:white;border:1px solid #dfe5ed;border-radius:18px;
    min-width:0;min-height:clamp(210px,35vh,320px);padding:clamp(22px,3.5vw,48px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;
    color:#1d2939;text-align:center;box-shadow:0 6px 24px rgba(15,23,42,.045);
    transition:border-color .16s,box-shadow .16s,transform .16s; }
  .choice:hover { border-color:#b6c7dc;box-shadow:0 12px 32px rgba(15,23,42,.09);transform:translateY(-3px); }
  .choice:active { transform:translateY(0); }
  .choice-icon { width:78px;height:78px;display:grid;place-items:center;border-radius:20px; }
  .choice-icon svg { width:43px;height:43px;fill:none;stroke:currentColor;stroke-width:1.8;
    stroke-linejoin:round;stroke-linecap:round; }
  .choice-one .choice-icon { color:#2563eb;background:#edf4ff; }
  .choice-two .choice-icon { color:#0f766e;background:#eaf8f5; }
  .choice-title { display:block;font-size:clamp(22px,2.25vw,31px);font-weight:700;line-height:1.28;letter-spacing:-.5px;max-width:430px; }

  /* Interior screens have simple headings and back navigation, no decorative copy. */
  .bar { flex:0 0 72px;min-height:0;display:flex;align-items:center;gap:20px;
    padding:0 clamp(22px,3vw,48px);border-bottom:1px solid var(--line); }
  .back { border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 14px;
    color:#344054;font-weight:600;font-size:13px;flex:0 0 auto; }
  .back:hover,.small-button:hover { background:#f8fafc; }
  .bar-name { font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
  .content { width:100%;flex:1 1 0;min-height:0;overflow:hidden;padding:clamp(28px,4vw,64px);
    display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start; }
  .section-title { font-size:clamp(32px,4vw,57px);letter-spacing:-1.5px;line-height:1.12;margin:0 0 35px;max-width:940px; }
  .product-grid { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;width:100%;max-width:1100px; }
  .product { min-width:0;min-height:225px;background:#fff;border:1px solid var(--line);
    border-radius:16px;padding:30px;text-align:left;display:flex;flex-direction:column;
    align-items:flex-start;justify-content:space-between;color:var(--ink);
    box-shadow:0 4px 18px rgba(15,23,42,.035); }
  .product:hover { border-color:#afc2d9;background:#fcfdff; }
  .product-name { font-size:clamp(23px,2.5vw,34px);font-weight:700;letter-spacing:-.5px; }
  .product-launch { display:flex;align-items:center;gap:12px;color:#2563eb;font-size:14px;font-weight:600; }

  /* The presentation container NEVER scrolls. Remote apps may scroll inside the frame. */
  .demo-bar { flex:0 0 72px;min-height:0;display:flex;align-items:center;gap:16px;
    padding:0 clamp(16px,2.2vw,34px);border-bottom:1px solid var(--line); }
  .demo-bar .bar-name { flex:1; }
  .demo-actions { display:flex;gap:8px;align-items:center; }
  .small-button { text-decoration:none;display:inline-flex;align-items:center;justify-content:center;
    border:1px solid var(--line);background:#fff;color:#344054;padding:10px 13px;
    border-radius:9px;font-size:13px;font-weight:600;white-space:nowrap; }
  .embed { flex:1 1 0;min-height:0;width:100%;overflow:hidden;position:relative;background:#f8fafc; }
  .embed iframe { border:0;width:100%;height:100%;display:block;background:white; }
  /* Fullscreen the entire demo screen, including its Back and Reload controls. */
  .screen:fullscreen { display:flex;flex-direction:column;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:#fff; }
  .screen:fullscreen .demo-bar { flex:0 0 72px; }
  .screen:fullscreen .embed { flex:1 1 0;min-height:0;overflow:hidden; }
  .screen:fullscreen .embed iframe { display:block;width:100%;height:100%; }
  @media(max-width:720px){.screen:fullscreen .demo-bar{flex-basis:64px}}

  /* Still scroll-free at smaller widths. */
  @media (max-width:720px) {
    .home { padding:20px; }
    .choices { grid-template-columns:minmax(0,1fr);gap:16px;max-width:440px; }
    .choice { min-height:clamp(145px,27dvh,215px);gap:14px;padding:17px; }
    .choice-icon { width:54px;height:54px;border-radius:13px; }
    .choice-icon svg { width:30px;height:30px; }
    .choice-title { font-size:clamp(19px,5vw,26px); }
    .bar,.demo-bar { flex-basis:64px;padding:0 15px;gap:8px; }
    .bar-name { font-size:14px; }
    .back { padding:10px; }
    .content { padding:25px 20px; }
    .section-title { font-size:clamp(27px,7vw,38px);margin-bottom:23px; }
    .product-grid { grid-template-columns:minmax(0,1fr);gap:14px; }
    .product { min-height:clamp(132px,24dvh,180px);padding:20px; }
    .product-name { font-size:23px; }
    .demo-actions { gap:5px; }
    .small-button { font-size:11px;padding:9px 8px; }
  }
  @media (max-height:520px) and (min-width:721px) {
    .choice { min-height:175px;gap:14px; }
    .choice-icon { width:60px;height:60px; }
    .choice-icon svg { width:34px;height:34px; }
    .content { padding:22px 40px; }
    .section-title { font-size:32px;margin-bottom:18px; }
    .product { min-height:170px; }
  }
  @media (prefers-reduced-motion:reduce) { .choice { transition:none; } }

</style>
</head>
<body>
<main>
  <section id="screen-home" class="screen home active" aria-label="Presentation home">
    <div class="choices">
      <button type="button" class="choice choice-one" data-go="self-service">
        <span class="choice-icon" aria-hidden="true">
          <svg viewBox="0 0 48 48"><path d="M8 11h32v23H24l-9 7v-7H8z"/><path d="M16 20h16M16 26h10"/><path d="m33 7 1.3 3.7L38 12l-3.7 1.3L33 17l-1.3-3.7L28 12l3.7-1.3z"/></svg>
        </span>
        <span class="choice-title">AI &amp; Self-Service</span>
      </button>
      <button type="button" class="choice choice-two" data-go="excellence">
        <span class="choice-icon" aria-hidden="true">
          <svg viewBox="0 0 48 48"><path d="M8 38V11M8 38h32"/><path d="m15 30 8-9 7 5 10-14"/><path d="M34 12h6v6"/><circle cx="15" cy="30" r="2"/><circle cx="23" cy="21" r="2"/><circle cx="30" cy="26" r="2"/></svg>
        </span>
        <span class="choice-title">AI, Automation &amp;<br>Performance Excellence</span>
      </button>
    </div>
  </section>

  <section id="screen-self-service" class="screen" hidden aria-label="AI and Self-Service">
    <header class="bar">
      <button type="button" class="back" data-go="home">← Back</button>
      <span class="bar-name">AI &amp; Self-Service</span>
    </header>
    <div class="content">
      <h1 class="section-title">Launches so far</h1>
    </div>
  </section>

  <section id="screen-excellence" class="screen" hidden aria-label="AI Automation and Performance Excellence">
    <header class="bar">
      <button type="button" class="back" data-go="home">← Back</button>
      <span class="bar-name">AI, Automation &amp; Performance Excellence</span>
    </header>
    <div class="content">
      <h1 class="section-title">AI, Automation &amp; Performance Excellence</h1>
      <div class="product-grid">
        <button type="button" class="product" data-go="qa">
          <span class="product-name">QA.MAFer.AI</span>
          <span class="product-launch">Launch application <span aria-hidden="true">→</span></span>
        </button>
        <button type="button" class="product" data-go="service360">
          <span class="product-name">SHARE Service360</span>
          <span class="product-launch">Launch application <span aria-hidden="true">→</span></span>
        </button>
      </div>
    </div>
  </section>

  <section id="screen-qa" class="screen" hidden aria-label="QA.MAFer.AI demo">
    <header class="demo-bar">
      <button type="button" class="back" data-go="excellence">← Back</button>
      <span class="bar-name">QA.MAFer.AI</span>
      <div class="demo-actions">
        <button type="button" class="small-button" data-reload="qa">Reload</button>
        <button type="button" class="small-button" data-expand="qa">Expand</button>
      </div>
    </header>
    <div id="embed-qa" class="embed">
      <iframe id="frame-qa" title="QA.MAFer.AI live demonstration" loading="eager" allow="fullscreen; clipboard-read; clipboard-write"></iframe>
    </div>
  </section>

  <section id="screen-service360" class="screen" hidden aria-label="SHARE Service360 demo">
    <header class="demo-bar">
      <button type="button" class="back" data-go="excellence">← Back</button>
      <span class="bar-name">SHARE Service360</span>
      <div class="demo-actions">
        <button type="button" class="small-button" data-reload="service360">Reload</button>
        <button type="button" class="small-button" data-expand="service360">Expand</button>
      </div>
    </header>
    <div id="embed-service360" class="embed">
      <iframe id="frame-service360" title="SHARE Service360 live demonstration" loading="eager" allow="fullscreen; clipboard-read; clipboard-write"></iframe>
    </div>
  </section>
</main>
<script>
(() => {
  "use strict";
  const sources = Object.freeze({
    qa: "https://expert-adventure-7z351g7.pages.github.io/",
    service360: "https://expert-adventure-7z351g7.pages.github.io/share-service360/"
  });
  const screens = ["home", "self-service", "excellence", "qa", "service360"];
  const loaded = new Set();
  const get = id => document.getElementById(id);
  let current = "home";

  function show(name, replace=false) {
    const id = screens.includes(name) ? name : "home";
    current = id;
    for (const screenName of screens) {
      const screen = get("screen-" + screenName);
      const active = screenName === id;
      screen.hidden = !active;
      screen.classList.toggle("active", active);
    }
    // Load each actual application directly in its full-height page.
    // Keep a loaded iframe mounted when switching screens to preserve demo state.
    if ((id === "qa" || id === "service360") && !loaded.has(id)) {
      get("frame-" + id).src = sources[id];
      loaded.add(id);
    }
    if (location.hash !== "#" + id) {
      if (replace) history.replaceState(null, "", "#" + id);
      else history.pushState(null, "", "#" + id);
    }
    document.title = id === "home" ? "Customer Solutions" :
      id === "self-service" ? "AI & Self-Service" :
      id === "excellence" ? "AI, Automation & Performance Excellence" :
      id === "qa" ? "QA.MAFer.AI" : "SHARE Service360";
  }

  document.addEventListener("click", e => {
    const button = e.target.closest("button");
    if (!button) return;
    if (button.dataset.go) {
      // Leave fullscreen first so Back remains reliable in presentation mode.
      const destination = button.dataset.go;
      if (document.fullscreenElement) {
        document.exitFullscreen().then(() => show(destination)).catch(() => show(destination));
      } else show(destination);
    } else if (button.dataset.reload && sources[button.dataset.reload]) {
      const id = button.dataset.reload;
      get("frame-" + id).src = sources[id];
      loaded.add(id);
    } else if (button.dataset.expand) {
      const panel = get("screen-" + button.dataset.expand);
      try {
        if (document.fullscreenElement) document.exitFullscreen();
        else if (panel.requestFullscreen) panel.requestFullscreen();
      } catch (error) { console.warn("Fullscreen unavailable", error); }
    }
  });

  document.addEventListener("fullscreenchange", () => {
    for (const key of ["qa", "service360"]) {
      const btn = document.querySelector('[data-expand="' + key + '"]');
      btn.textContent = document.fullscreenElement === get("screen-" + key) ? "Collapse" : "Expand";
    }
  });
  window.addEventListener("popstate", () => show(location.hash.slice(1), true));
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && !document.fullscreenElement && current !== "home") {
      show(current === "qa" || current === "service360" ? "excellence" : "home");
    }
  });
  show(location.hash.slice(1) || "home", true);
})();
</script>
</body>
</html>
